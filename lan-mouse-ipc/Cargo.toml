[package]
name = "lan-mouse-ipc"
description = "library for communication between lan-mouse service and frontends"
version = "0.3.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/feschber/lan-mouse"

[dependencies]
futures = "0.3.30"
log = "0.4.22"
# `EdgeRange` lives in input-event, the one crate both the daemon and the
# frontends already share for event types
input-event = { path = "../input-event", version = "0.4.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.107"
thiserror = "2.0.0"
tokio = { version = "1.32.0", features = ["macros", "net", "io-util", "time"] }
tokio-stream = { version = "0.1.15", features = ["io-util"] }

[dev-dependencies]
# `rt` for `#[tokio::test]`, the listener tests use real unix sockets
tokio = { version = "1.32.0", features = ["rt", "rt-multi-thread"] }
futures = "0.3.30"
serde_json = "1.0.107"
