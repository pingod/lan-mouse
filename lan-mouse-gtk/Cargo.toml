[package]
name = "lan-mouse-gtk"
description = "GTK4 / Libadwaita Frontend for lan-mouse"
version = "0.3.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/feschber/lan-mouse"

[dependencies]
gtk = { package = "gtk4", version = "0.9.0", features = ["v4_2"] }
# Text on the arrangement canvas goes through pango: the cairo toy font API has
# no fallback, so a hostname with non-latin characters came out as empty boxes.
# `pango` is already in the tree through gtk4; this is only the cairo glue.
pangocairo = "0.20"
adw = { package = "libadwaita", version = "0.7.0", features = ["v1_4"] }
async-channel = { version = "2.1.1" }
hostname = "0.4.0"
log = "0.4.20"
lan-mouse-ipc = { path = "../lan-mouse-ipc", version = "0.3.0" }
thiserror = "2.0.0"

[dev-dependencies]
# Only for the canvas render tests, which write a PNG of a layout so the picture
# can be looked at. Feature-unified into the test build only, so the shipped
# binary does not pick up libpng.
cairo = { package = "cairo-rs", version = "0.20", features = ["png"] }

[build-dependencies]
glib-build-tools = { version = "0.20.0" }
